name: Deploy Production to Beget

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  web-deploy:
    name: Sync Files to Beget Hosting
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🧹 Auto-clean server address and directory
        run: |
          RAW_SERVER="${{ secrets.BEGET_FTP_SERVER }}"
          # Удаляем протоколы ftp://, http://, https://
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[^/]*://||' -e 's|/.*$||' | tr -d '[:space:]')
          
          RAW_DIR="${{ secrets.BEGET_REMOTE_DIR }}"
          CLEAN_DIR=$(echo "$RAW_DIR" | tr -d '\r\n' | sed -e 's|^[[:space:]]*||' -e 's|[[:space:]]*$||')
          # Гарантируем слэш на конце
          [[ "$CLEAN_DIR" != */ ]] && CLEAN_DIR="${CLEAN_DIR}/"
          
          echo "CLEAN_SERVER=${CLEAN_SERVER}" >> $GITHUB_ENV
          echo "CLEAN_DIR=${CLEAN_DIR}" >> $GITHUB_ENV

      - name: 📂 Sync files to Beget
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.CLEAN_SERVER }}
          username: ${{ secrets.BEGET_FTP_USERNAME }}
          password: ${{ secrets.BEGET_FTP_PASSWORD }}
          server-dir: ${{ env.CLEAN_DIR }}
          protocol: ftp
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/.agents/**
            **/.gemini/**
            **/db_config.php
            **/backups/**
            **/*.docx
            **/USER_MANUAL.docx
            **/rebuild_zip_temp.py
            **/test_*.js
            **/node_modules/**
