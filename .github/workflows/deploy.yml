name: Deploy Production to Beget

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  web-deploy:
    name: Sync Files to Beget Hosting
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📂 Sync files via FTPS to Beget
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BEGET_FTP_SERVER }}
          username: ${{ secrets.BEGET_FTP_USERNAME }}
          password: ${{ secrets.BEGET_FTP_PASSWORD }}
          server-dir: ${{ secrets.BEGET_REMOTE_DIR }}
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/.agents/**
            **/.gemini/**
            **/db_config.php
            **/backups/**
            **/*.docx
            **/USER_MANUAL.docx
            **/rebuild_zip_temp.py
            **/test_*.js
            **/node_modules/**
